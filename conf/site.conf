#
# local.conf covers user settings, site.conf covers site specific information
# such as proxy server addresses and optionally any shared download location
#
# SITE_CONF_VERSION is increased each time build/conf/site.conf
# changes incompatibly
SCONF_VERSION = "1"

# Uncomment to cause CVS to use the proxy host specified
#CVS_PROXY_HOST = "proxy.example.com"
#CVS_PROXY_PORT = "81"

# For svn, you need to create ~/.subversion/servers containing:
#[global]
#http-proxy-host = proxy.example.com
#http-proxy-port = 81
#

# Uncomment to cause git to use the proxy host specificed
# although this only works for http
#GIT_PROXY_HOST = "proxy.example.com"
#GIT_PROXY_PORT = "81"
#export GIT_PROXY_COMMAND = "${POKYBASE}/scripts/poky-git-proxy-command"

# GIT_PROXY_IGNORE_* lines define hosts which do not require a proxy to access
#GIT_CORE_CONFIG = "Yes"
#GIT_PROXY_IGNORE_1 = "host.server.com"
#GIT_PROXY_IGNORE_2 = "another.server.com"

# If SOCKS is available run the following command to comple a simple transport
# gcc scripts/poky-git-proxy-socks.c -o poky-git-proxy-socks
# and then share that binary somewhere in PATH, then use the following settings
#GIT_PROXY_HOST = "proxy.example.com"
#GIT_PROXY_PORT = "81"
#export GIT_PROXY_COMMAND = "${POKYBASE}/scripts/poky-git-proxy-socks-command"


# Uncomment this to use a shared download directory
#DL_DIR = "/some/shared/download/directory/"

# Build-time credentials (OAuth client ids for the Synergy connectors and the music backend) from
# the private webOS-ports/luneos-secrets repository. "make update-secrets" clones it into secrets/
# and links its secrets.conf here for those who can read it; without the file nothing is included
# and those accounts cannot sign in. Packages and sstate built with it carry the values: do not
# publish them.
include conf/secrets.conf

# Build clang-native and llvm-native as Release + PGO + ThinLTO with meta-pgo (see layers.txt).
# OE-core builds them MinSizeRel (-Os), and every clang compile pays for it: on three webruntime
# 151 translation units this compiler is 2.76x faster than OE's (296s -> 107s, median of three).
# Turning it on rebuilds clang-native and llvm-native through two extra LLVM builds (a gcc-built
# stage1 clang, then an instrumented clang that is trained to produce the profile), once; after
# that they come from sstate. Each LLVM translation unit takes 1-2 GB, so on a machine with
# little memory per thread cap these recipes with PARALLEL_MAKE:pn-<recipe> in local.conf.
PACKAGECONFIG:append:pn-clang-native = " thin-lto-pgo"
PACKAGECONFIG:append:pn-llvm-native = " thin-lto-pgo"
